<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice Shop Login</title>
</head>

<body>

    <h1>Juice Shop Login</h1>

    <form id="loginForm">

        <label for="email">Email:</label>
        <input
            type="text"
            id="email"
            name="email"
            required
        >

        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">Login</button>

    </form>

    <p id="message"></p>

    <script src="script.js"></script>

</body>
</html>
